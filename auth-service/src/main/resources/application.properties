spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:veterinaria}?sslmode=${DB_SSLMODE:require}&currentSchema=auth
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=auth
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=auth
spring.flyway.default-schema=auth

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXP_MIN:60}
app.jwt.issuer=${JWT_ISSUER:veterinaria-san-marcos}
app.jwt.audience=${JWT_AUDIENCE:veterinaria-frontend}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nombre=Administrador
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
