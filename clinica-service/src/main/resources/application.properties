spring.application.name=clinica-service
server.port=8082


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:veterinaria}?sslmode=${DB_SSLMODE:require}&currentSchema=clinica
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=clinica
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=clinica
spring.flyway.default-schema=clinica


app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:veterinaria-san-marcos}
app.jwt.audience=${JWT_AUDIENCE:veterinaria-frontend}
app.zona-horaria=America/Santiago
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
